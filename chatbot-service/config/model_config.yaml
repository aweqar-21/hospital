# ===========================================
# 模型相关配置
# ===========================================

# 对话模型（可定义多个，按场景选用）
models:
  default:
    provider: deepseek
    model_name: deepseek-v4-flash
    temperature: 0.7
    max_tokens: 2048

  fast:
    provider: deepseek
    model_name: deepseek-v4-flash
    temperature: 0.5
    max_tokens: 1024

  reasoning:
    provider: deepseek
    model_name: deepseek-v4-flash
    temperature: 0.1
    max_tokens: 4096

# 嵌入模型
embedding:
  provider: openai
  model_name: text-embedding-3-small
  dimension: 1536

# 意图分类模型（可选用轻量模型降低成本）
intent:
  provider: deepseek
  model_name: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 256

# 检索参数
retrieval:
  top_k: 5
  similarity_threshold: 0.65
  max_chunk_size: 512
  chunk_overlap: 50

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 720px; max-width: 95vw; height: 90vh;
            background: #fff; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; padding: 18px 24px; font-size: 18px; font-weight: 600;
        }
        .status { font-size: 12px; opacity: 0.85; font-weight: 400; margin-left: 8px; }
        .messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg { max-width: 80%; padding: 10px 16px; border-radius: 18px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: #667eea; color: #fff; border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: #f0f2f5; color: #333; border-bottom-left-radius: 4px; }
        .msg.system { align-self: center; background: #fff3cd; color: #856404; border-radius: 8px; font-size: 13px; max-width: 90%; }
        .input-area { display: flex; padding: 16px; border-top: 1px solid #e8e8e8; gap: 10px; }
        .input-area input {
            flex: 1; padding: 12px 16px; border: 1px solid #ddd;
            border-radius: 24px; font-size: 15px; outline: none;
        }
        .input-area input:focus { border-color: #667eea; }
        .input-area button {
            padding: 12px 28px; background: #667eea; color: #fff;
            border: none; border-radius: 24px; font-size: 15px; cursor: pointer;
        }
        .input-area button:hover { background: #5a6fd6; }
        .input-area button:disabled { opacity: 0.6; cursor: not-allowed; }
        .typing { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #999; animation: blink 1.4s infinite; margin: 0 2px; }
        .typing:nth-child(2) { animation-delay: 0.2s; }
        .typing:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%,60%,100% { opacity: 0.2; } 30% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">🤖 Chatbot <span class="status" id="status">检测中...</span></div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="input" type="text" placeholder="输入消息，按回车发送..." autofocus disabled>
            <button id="sendBtn" onclick="send()" disabled>发送</button>
        </div>
    </div>

    <script>
        const API = '/chat';
        let sessionId = null;

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            const box = document.getElementById('messages');
            box.scrollTop = box.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'msg assistant';
            div.id = 'typing-msg';
            div.innerHTML = '<span class="typing"></span><span class="typing"></span><span class="typing"></span>';
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-msg');
            if (el) el.remove();
        }

        async function send() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = ''; input.focus();
            document.getElementById('sendBtn').disabled = true;
            addMsg('user', msg);
            addTyping();

            try {
                const resp = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, session_id: sessionId })
                });
                const data = await resp.json();
                sessionId = data.session_id;
                removeTyping();
                addMsg('assistant', data.reply);
            } catch (e) {
                removeTyping();
                addMsg('system', '⚠️ 无法连接到服务器，请确认服务已启动（python main.py）');
            }
            document.getElementById('sendBtn').disabled = false;
        }

        async function checkHealth() {
            try {
                const resp = await fetch('/health');
                const data = await resp.json();
                document.getElementById('status').textContent = '✓ 已就绪';
                document.getElementById('status').style.color = '#90EE90';
                document.getElementById('input').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('input').placeholder = '输入消息，按回车发送...';
                document.getElementById('input').focus();
            } catch (e) {
                document.getElementById('status').textContent = '✗ 服务未连接';
                document.getElementById('status').style.color = '#FFB6C1';
                setTimeout(checkHealth, 2000);
            }
        }

        document.getElementById('input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !document.getElementById('sendBtn').disabled) send();
        });

        checkHealth();
    </script>
</body>
</html>

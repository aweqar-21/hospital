[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot"
version = "0.1.0"
description = "模块化智能对话机器人"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "AWEQAR_21", email = "aweqar1225918785@gmail.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0",
    "openai>=1.10.0",
    "jieba>=0.42.1",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
local = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "llama-cpp-python>=0.2.0",
]
grpc = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*", "data*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

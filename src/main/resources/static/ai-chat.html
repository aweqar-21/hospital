<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 健康咨询</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f3f7f8; color: #17323a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, textarea { font: inherit; }
    .page { width: min(960px, 100%); min-height: 100vh; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .masthead, .chat-card { background: #fff; border: 1px solid #d9e4e7; border-radius: 16px; box-shadow: 0 8px 24px rgba(31, 72, 83, .08); }
    .masthead { padding: 22px 24px; display: flex; justify-content: space-between; gap: 20px; align-items: start; }
    h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); }
    .status { margin: 7px 0 0; color: #527078; font-size: .92rem; }
    .disclaimer { margin: 0; padding: 13px 16px; border-left: 4px solid #c4671a; background: #fff5e8; color: #684112; border-radius: 8px; line-height: 1.55; }
    .new-session, .send { border: 0; border-radius: 9px; padding: 10px 15px; font-weight: 650; cursor: pointer; transition: transform .15s ease, background .15s ease; }
    .new-session { color: #075f72; background: #e7f5f7; white-space: nowrap; }
    .send { color: #fff; background: #087b91; min-width: 88px; }
    .new-session:hover, .new-session:focus-visible { background: #cdecee; }
    .send:hover, .send:focus-visible { background: #05697c; }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .58; transform: none; }
    .chat-card { min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; min-height: 340px; max-height: 58vh; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .message { max-width: min(78%, 620px); padding: 12px 14px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .assistant { align-self: flex-start; background: #e8f4f4; border-bottom-left-radius: 4px; }
    .user { align-self: flex-end; background: #087b91; color: #fff; border-bottom-right-radius: 4px; }
    .error { align-self: center; max-width: 100%; color: #9a2d21; background: #fff0ed; border: 1px solid #f2c3ba; font-size: .94rem; }
    .composer { border-top: 1px solid #d9e4e7; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    label { font-weight: 650; display: block; margin-bottom: 7px; }
    textarea { display: block; width: 100%; min-height: 86px; max-height: 180px; padding: 11px 12px; resize: vertical; color: inherit; border: 1px solid #a9bec3; border-radius: 9px; line-height: 1.45; }
    textarea:focus-visible, button:focus-visible { outline: 3px solid #7ed5df; outline-offset: 2px; }
    .hint { margin: 7px 0 0; color: #527078; font-size: .84rem; }
    @media (max-width: 640px) {
      .page { padding: 12px; gap: 12px; }
      .masthead { padding: 18px; flex-direction: column; }
      .new-session { width: 100%; }
      .messages { min-height: 300px; max-height: 54vh; padding: 14px; }
      .message { max-width: 91%; }
      .composer { grid-template-columns: 1fr; }
      .send { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <h1>AI 健康咨询</h1>
        <p class="status" id="status" role="status">准备就绪，可匿名咨询。</p>
      </div>
      <button class="new-session" id="new-session" type="button">新建会话</button>
    </header>

    <p class="disclaimer"><strong>重要提示：</strong>AI 健康咨询仅供健康信息参考，不能替代医生的诊断、治疗或处方。如出现胸痛、呼吸困难、意识不清、大量出血等紧急情况，请立即拨打当地急救电话或前往急诊就医。</p>

    <section class="chat-card" aria-label="健康咨询对话">
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="咨询消息"></div>
      <form class="composer" id="chat-form">
        <div>
          <label for="message">描述您的健康问题</label>
          <textarea id="message" name="message" maxlength="4096" maxLength="4096" placeholder="例如：我从昨天开始头痛，还伴有轻微发热。" required></textarea>
          <p class="hint">按 Enter 发送，Shift + Enter 换行。请勿在此输入紧急情况下需要立即处理的信息。</p>
        </div>
        <button class="send" id="send" type="submit">发送</button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var SESSION_STORAGE_KEY = 'hospitalAiSessionId';
      var PAGE_PATH = '/ai-chat.html';
      var REQUEST_TIMEOUT_MS = 65000;
      var messages = document.getElementById('messages');
      var form = document.getElementById('chat-form');
      var input = document.getElementById('message');
      var sendButton = document.getElementById('send');
      var newSessionButton = document.getElementById('new-session');
      var status = document.getElementById('status');
      var submitting = false;

      function apiUrl() {
        var currentPath = window.location.pathname;
        var contextPath = currentPath.slice(-PAGE_PATH.length) === PAGE_PATH
          ? currentPath.slice(0, -PAGE_PATH.length)
          : '';
        return (contextPath || '') + '/ai/chat';
      }

      function addMessage(kind, text) {
        var item = document.createElement('div');
        item.className = 'message ' + kind;
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      function setStatus(text) {
        status.textContent = text;
      }

      function setLoading(loading) {
        submitting = loading;
        input.disabled = loading;
        sendButton.disabled = loading;
        newSessionButton.disabled = loading;
        sendButton.textContent = loading ? '发送中…' : '发送';
      }

      function getStorageItem(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      }

      function setStorageItem(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch (error) {
          // Storage is optional: anonymous chat must keep working without it.
        }
      }

      function removeStorageItem(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (error) {
          // Storage is optional: reset still clears the visible conversation.
        }
      }

      function storedSessionId() {
        return getStorageItem(SESSION_STORAGE_KEY);
      }

      function saveSessionId(sessionId) {
        if (typeof sessionId === 'string' && sessionId) {
          setStorageItem(SESSION_STORAGE_KEY, sessionId);
        }
      }

      function existingToken() {
        return getStorageItem('token') ||
          getStorageItem('Authorization') ||
          getStorageItem('hospitalToken');
      }

      function publicError(responseStatus, timeout) {
        if (timeout) {
          return '请求超时，请检查网络后重试。';
        }
        if (responseStatus === 400) {
          return '问题内容暂时无法处理，请修改后重试。';
        }
        if (responseStatus === 404) {
          return '咨询服务暂时不可用，请稍后重试。';
        }
        if (responseStatus === 503) {
          return '咨询服务繁忙，请稍后重试。';
        }
        return '暂时无法发送咨询，请检查网络后重试。';
      }

      function readResult(response) {
        return response.text().then(function (text) {
          if (!text) {
            throw new Error('malformed-result');
          }
          try {
            return JSON.parse(text);
          } catch (error) {
            throw new Error('malformed-result');
          }
        });
      }

      function resetConversation() {
        if (submitting) {
          return;
        }
        removeStorageItem(SESSION_STORAGE_KEY);
        while (messages.firstChild) {
          messages.removeChild(messages.firstChild);
        }
        addMessage('assistant', '您好，我可以帮助您整理健康问题并提供一般健康信息。请告诉我您的症状、持续时间和已知情况。');
        setStatus('已新建会话，可继续咨询。');
        input.value = '';
        input.focus();
      }

      function restoreForRetry(message) {
        input.value = message;
        input.focus();
        input.select();
      }

      function submitMessage() {
        var message = input.value.trim();
        if (submitting) {
          return;
        }
        if (!message) {
          setStatus('请输入需要咨询的健康问题。');
          input.focus();
          return;
        }
        if (message.length > 4096) {
          setStatus('内容不能超过 4096 个字符。');
          return;
        }

        var payload = { message: message };
        var sessionId = storedSessionId();
        if (sessionId) {
          payload.session_id = sessionId;
        }
        var controller = window.AbortController ? new AbortController() : null;
        var timeoutId = controller ? window.setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS) : null;
        var headers = { 'Content-Type': 'application/json' };
        var token = existingToken();
        if (token) {
          headers.Authorization = token.indexOf('Bearer ') === 0 ? token : 'Bearer ' + token;
        }

        addMessage('user', message);
        input.value = '';
        setLoading(true);
        setStatus('正在获取咨询建议…');

        var retryMessage = null;
        window.fetch(apiUrl(), {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(payload),
          signal: controller ? controller.signal : undefined
        }).then(function (response) {
          if (!response.ok) {
            throw { responseStatus: response.status };
          }
          return readResult(response);
        }).then(function (result) {
          if (!result || result.code !== 200 || !result.data || typeof result.data.reply !== 'string') {
            throw new Error('malformed-result');
          }
          saveSessionId(result.data.session_id);
          addMessage('assistant', result.data.reply);
          setStatus('已收到咨询建议。');
        }).catch(function (error) {
          var timedOut = error && error.name === 'AbortError';
          retryMessage = message;
          addMessage('error', publicError(error && error.responseStatus, timedOut));
          setStatus('发送未成功，您可以修改内容后重试。');
        }).then(function () {
          if (timeoutId !== null) {
            window.clearTimeout(timeoutId);
          }
          setLoading(false);
          if (retryMessage !== null) {
            restoreForRetry(retryMessage);
          } else {
            input.focus();
          }
        });
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        submitMessage();
      });
      input.addEventListener('keydown', function (event) {
        if (event.isComposing || event.keyCode === 229) {
          return;
        }
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          submitMessage();
        }
      });
      newSessionButton.addEventListener('click', resetConversation);

      addMessage('assistant', '您好，我可以帮助您整理健康问题并提供一般健康信息。请告诉我您的症状、持续时间和已知情况。');
    }());
  </script>
</body>
</html>
